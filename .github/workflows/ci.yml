name: Continuous Integration

on:
  push:
    branches: [main, "production/**", "feature/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      - name: Set up Bun 1.4.4
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run lint

      - name: Run automated tests
        run: bun run test

      - name: Build production artefacts
        run: bun run build

      - name: Smoke test the built production server
        run: bun run smoke:production

      - name: Install Chromium for browser tests
        run: bunx playwright install --with-deps chromium

      - name: Run browser E2E and accessibility checks
        run: bun run test:e2e

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: self-modifying-studio-build
          path: dist/
          if-no-files-found: error
          retention-days: 7
