name: One-shot Browser Test Dependencies

on:
  push:
    branches: ["production/**"]

# This workflow is inert unless a maintainer explicitly creates a commit whose
# message contains [add-browser-test-deps].
permissions:
  contents: write

concurrency:
  group: browser-test-deps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  add-dependencies:
    if: contains(github.event.head_commit.message, '[add-browser-test-deps]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Set up Bun 1.4.4
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - name: Add Playwright and axe accessibility test dependencies
        run: bun add --dev @playwright/test @axe-core/playwright
      - name: Verify dependency audit and existing quality gates
        run: |
          bun audit
          bun run lint
          bun run test
          bun run build
          bun run smoke:production
          git diff --check
      - name: Commit and push verified dependency manifest and lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- package.json bun.lock; then
            echo "Browser test dependencies were already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git commit -m "test: add Playwright and axe browser test tooling"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push origin "HEAD:${GITHUB_REF_NAME}"
